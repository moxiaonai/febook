<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>正在打开剑指Offer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32rem),
          linear-gradient(135deg, #eff6ff, #ffffff);
        color: #0f172a;
      }

      main {
        width: min(88vw, 28rem);
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        line-height: 1.75;
        color: #475569;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top left, rgba(59, 130, 246, 0.2), transparent 32rem),
            linear-gradient(135deg, #0f172a, #111827);
          color: #f8fafc;
        }

        main {
          border-color: rgba(148, 163, 184, 0.18);
          background: rgba(15, 23, 42, 0.78);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在打开剑指Offer</h1>
      <p>已接收到 web+febook 协议请求，马上返回站点首页。</p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const protocolUrl = params.get('url') || '';

        if (protocolUrl) {
          sessionStorage.setItem('febook:protocol-url', protocolUrl);
        }

        const targetUrl = new URL('/', window.location.origin);
        if (protocolUrl) {
          targetUrl.searchParams.set('protocol', protocolUrl);
        }

        window.setTimeout(() => {
          window.location.replace(targetUrl.toString());
        }, 300);
      })();
    </script>
  </body>
</html>
